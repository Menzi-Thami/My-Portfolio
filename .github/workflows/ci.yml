name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install
        run: npm ci

      # No lint step: `next lint` is in package.json but eslint is not a
      # dependency, so it would fail on a clean install.
      - name: Build
        run: npm run build
