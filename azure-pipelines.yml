# Next.js portfolio — build verification
# Node version is pinned to match .nvmrc and package.json engines.

trigger:
- main

pr:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Use Node 22.x'

- script: npm ci
  displayName: 'npm ci'

- script: npm run build
  displayName: 'next build'
